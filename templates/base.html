<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}PortfolioIQ{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* ── THIS BASE HTML IS THE GENERAL LOOK OF THE ENTIRE DASHBOARD WE WILL IMPORT THIS AS THE STYLE OF ADDITIONAL PAGES FOR CONSISTENCY ──  */

    /* ── LET'S SET A COLOR SCHEME TO WORK WITH ── */
    :root {
      --bg:       #0A0E14;
      --surface:  #111820;
      --border:   #1E2836;
      --gold:     #C9A84C;
      --gold-dim: #8A6F30;
      --amber:    #E8943A;
      --text:     #D8D0C4;
      --muted:    #5A6478;
      --green:    #4CAF82;
      --red:      #CF6679;
      --font-serif: 'DM Serif Display', serif;
      --font-sans:  'DM Sans', sans-serif;
      --font-mono:  'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 300;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── BUILD NAVIGATION MENU ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,14,20,0.92);
      backdrop-filter: blur(12px);
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: 0.02em;
      text-decoration: none;
    }
    .nav-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── GENERAL LAYOUT FOR WEBPAGES ── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* ── PUT INFORMATION ON CARDS TO LOOK BETTER ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .card-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.6rem;
      display: block;
    }
    .card h2 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    /* ── SOME FORMS WILL NEED TO BE FILLED OUT  ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .form-group input,
    .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.65rem 0.9rem;
      border-radius: 3px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--gold-dim);
    }
    .form-group select option { background: var(--surface); }

    /* ── GENERAL LOOK OF BUTTONS ── */
    .btn {
      display: inline-block;
      padding: 0.8rem 2.2rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: var(--gold); color: var(--bg); }
    .btn-full { width: 100%; text-align: center; margin-top: 1.5rem; }

    /* ── STAT CHIPS TO DISPLAY INFOMATION ── */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .stat-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1rem 1.2rem;
    }
    .stat-chip .label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 0.4rem;
    }
    .stat-chip .value {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--text);
    }
    .stat-chip .value.gold { color: var(--gold); }
    .stat-chip .value.green { color: var(--green); }
    .stat-chip .value.red { color: var(--red); }

    /* ── WEIGHT BARS ── */
    .weight-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .weight-label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      width: 52px;
      flex-shrink: 0;
    }
    .weight-bar-bg {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .weight-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .weight-pct {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text);
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── RISK METER ── */
    .risk-meter {
      margin: 1.2rem 0;
    }
    .risk-track {
      height: 8px;
      background: linear-gradient(to right, #4CAF82, #C9A84C, #CF6679);
      border-radius: 4px;
      position: relative;
    }
    .risk-thumb {
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: -4px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 3px var(--gold);
      transition: left 0.5s ease;
    }
    .risk-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--muted);
    }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge-green  { background: rgba(76,175,130,0.15);  color: var(--green); border: 1px solid rgba(76,175,130,0.3);  }
    .badge-amber  { background: rgba(232,148,58,0.15);  color: var(--amber); border: 1px solid rgba(232,148,58,0.3);  }
    .badge-red    { background: rgba(207,102,121,0.15); color: var(--red);   border: 1px solid rgba(207,102,121,0.3); }

    /* ── BOTTOM DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* ── INCLUDING A FOOTER ── */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">PortfolioIQ</a>
    <span class="nav-tag">Risk-Optimized Asset Allocation - <a href='/technical-report' target='_blank'>Technical Report</a></span>
  </nav>

  {% block content %}{% endblock %}

  <footer>
    <strong>Investor Gurus</strong> | Capstone Project | University of Michigan Master of Applied Data Science | <strong>NOT FINANCIAL ADVICE</strong>
  </footer>
</body>
</html>
